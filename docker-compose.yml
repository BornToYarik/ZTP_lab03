services:
  postgres:
    image: postgres:16-alpine
    container_name: ztp_lab03_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ztp_lab03
    ports:
      - "5432:5432"
    volumes:
      - ztp_lab03_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ztp_lab03"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ztp_lab03_pgdata:
